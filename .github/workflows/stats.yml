# Builds a custom stats card (assets/stats.svg) using the Action's built-in
# token — no Vercel, no PAT, no shared rate-limited instance.
name: generate stats card
on:
  schedule:
    - cron: "30 0 * * *"     # daily
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build card
        run: python scripts/generate_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER:  ${{ github.repository_owner }}
      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore: update stats card" || echo "no changes"
          git push
